<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <p class="site-title"><a href="index.html">{{ site_title }}</a></p>
    <div class="feed-meta">
      Feed updated {{ feed_updated[:16] | replace("T", " ") }} UTC<br>
      Page built {{ generated_at }}
    </div>
  </div>
</header>
<main class="wrap fade-in">
{% block content %}{% endblock %}
<footer class="site-footer">
  Source data: live roadworks feed · rebuilt on a schedule via GitHub Actions.
</footer>
</main>
</body>
</html>
