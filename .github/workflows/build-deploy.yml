name: Build and deploy route closures site

on:
  schedule:
    # Every 10 minutes (UTC). https://crontab.guru is handy for changing this.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual rebuild from the Actions tab
  push:
    branches: [main]      # rebuild whenever routes.yaml or templates change

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # TEMPORARY: contents: write overrides the top-level `contents: read`
    # default (deploy below still gets the read-only default, unaffected)
    # ONLY so the "Commit investigation log" step below can push. See
    # investigation_log.py's module docstring -- revert this override
    # (delete these two lines) once that investigation is done and that
    # step is removed.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node (for test_day_filter.js only)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs BEFORE the actual site build, deliberately -- fail fast on a
      # broken change rather than building/deploying a site whose
      # underlying logic tests confirm is wrong. Neither test file needs
      # the real site built first: both call the actual project code
      # (matching.py, sources/*.py, day-filter.js) directly against their
      # own fixtures.
      - name: Run Python test suite
        run: python test_build.py

      - name: Run day-filter.js test suite
        run: node test_day_filter.js

      - name: Build site
        run: python build.py
        env:
          NATIONAL_HIGHWAYS_API_KEY: ${{ secrets.NATIONAL_HIGHWAYS_API_KEY }}

      # TEMPORARY -- see investigation_log.py's module docstring for what
      # this is and when to remove it (this step, the permissions
      # override above, investigation_log.py itself, and its call in
      # build.py's main()). Most runs have nothing new to commit (the
      # tracked sources are usually quiet -- that's expected), so this
      # step is a no-op almost every time it runs. "[skip ci]" in the
      # commit message is load-bearing: without it, this push would
      # itself satisfy the `push: branches: [main]` trigger above and
      # re-run this whole workflow, which could commit again and trigger
      # again -- GitHub's Actions runner recognizes that marker and skips
      # starting a new run for a commit that contains it.
      #
      # Retries with a fresh pull/rebase between attempts, since two
      # runs can still legitimately race to push around the same
      # 10-minute mark -- .gitattributes' `merge=union` on this specific
      # file (see that file's comments) makes the rebase itself resolve
      # cleanly rather than conflict when that happens, but the push
      # itself can still be rejected as non-fast-forward if another run
      # wins the race in between our rebase and our push, hence retrying
      # rather than assuming one attempt is enough. Deliberately never
      # fails the job even if all retries are exhausted -- this log is a
      # best-effort, non-critical diagnostic aid, not something worth
      # blocking the actual site deploy over; a future run will likely
      # still capture the same underlying entries if they're still
      # active, since a record only stops being "new" once it's actually
      # been committed.
      - name: Commit investigation log (temporary -- see investigation_log.py)
        run: |
          if [ -z "$(git status --porcelain investigation-log/)" ]; then
            echo "No new investigation log entries this build."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add investigation-log/
          git commit -m "Update investigation log [skip ci]"

          pushed=false
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              pushed=true
              break
            fi
            echo "Push attempt $attempt failed (another run likely pushed first) -- retrying..."
            git rebase --abort || true
            sleep $(( (RANDOM % 8) + attempt * 2 ))
          done

          if [ "$pushed" = false ]; then
            echo "::warning::Could not push the investigation log after 5 attempts -- this run's new entries were not committed. Not treated as a build failure."
            git rebase --abort || true
          fi

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
