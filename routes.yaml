# ---------------------------------------------------------------------------
# Route definitions
# ---------------------------------------------------------------------------
# Each route has a northbound and a southbound direction. Each direction is
# a *chain of legs* -- one or more road sections travelled in order -- so
# you can model a real driving route that crosses several motorways.
#
# Per leg:
#   road_name        must match the closure's road (e.g. "M6", "A14")
#   junction_from /
#   junction_to      junction range for this leg. Omit both (or set to null)
#                    to mean "entire road" -- no junction filtering.
#   data_direction   the literal direction value used in the feed for that
#                    road: northBound / southBound / eastBound / westBound
#                    (National Highways' camelCase) or Northbound /
#                    Southbound (Traffic Scotland's style) -- matching is
#                    case-insensitive so either casing works. Not every
#                    road is signed north/south -- e.g. the M58 and M62
#                    here run east/west. Check the feed if unsure.
#
# M74 note: the M74 becomes "A74(M)" on its southern stretch near the
# Scotland/England border. build.py treats these as the same road via
# SCOTLAND_ROAD_ALIASES and always normalizes to "M74", so legs below
# just use "M74" regardless of which name a given closure was published
# under.
# ---------------------------------------------------------------------------

site:
  title: "Route Disruptions"

  # --- Live National Highways API (default) ---
  # Requires a free API key from https://developer.data.nationalhighways.co.uk
  # Set it as a GitHub Actions secret named NATIONAL_HIGHWAYS_API_KEY (see README),
  # or export it locally before running build.py.
  source: "national_highways_api"
  api_base_url: "https://api.data.nationalhighways.co.uk"
  closure_type: null          # "planned", "unplanned", or null for both (fetched as
                               # two separate requests -- see sources/national_highways.py)
  lookahead_days: 29          # how far ahead to fetch closures for (API max: 30)

  # --- Alternative: a pre-flattened JSON mirror (no API key needed) ---
  # Uncomment these two lines and comment out the "source:" line above
  # (and the three lines below it) to use this instead.
  # source: "flat_json"
  # data_url: "https://raw.githubusercontent.com/andypratt182/Road-data/refs/heads/main/data/road_data.json"

  # --- Additional sources, layered on top of the primary source above ---
  additional_sources:
    # National Highways advance-notice XLSX: the public "7 day closure
    # report" -- FULL closures (whole carriageway, typically 8pm-6am) up
    # to 7 days ahead, published before the API would show them (the API
    # only reports closures once VSS signs are actively set). Rows show
    # as "Advance notice (full closure)" in the site's Source column.
    - type: "xlsx_advance_notice"
      url: "https://nationalhighways.co.uk/media/1dgh4t0q/7-day-closure-report.xlsx"

    # Traffic Scotland: scraped (no self-service API available -- see
    # build.py's comments above fetch_from_traffic_scotland for why).
    # Covers Scotland's trunk road network; road_name is the ONLY filter
    # applied at fetch time -- junction range filtering happens per-leg
    # below, same as every other source. Rows show as "Traffic Scotland
    # (scraped)" in the Source column.
    #
    # UNVERIFIED AGAINST LIVE MARKUP: the HTML-parsing step (finding each
    # entry's container) was tested against a plausible structure, not
    # the real site, since no network access was available while writing
    # it. If the first live run logs "parsed 0 total entries" for either
    # Traffic Scotland page, that's the signal something needs
    # adjusting -- see build.py's comments for how to debug it. A
    # failure here is a warning, not a build-breaking error either way.
    - type: "traffic_scotland_scraper"
      road_name: "M74"

    # National Highways "Travel Alerts": major incidents (crashes, fires,
    # serious collisions), scraped from the public alerts page. NOT
    # auto-enabled by default -- add one entry per road you want covered,
    # e.g.:
    #   - type: "travel_alerts_scraper"
    #     road_name: "M6"
    # This is a genuinely different, non-overlapping data source from the
    # API's own "unplanned" closureType (confirmed by comparing real
    # output from both on the same day) -- see build.py's comments and
    # sources/travel_alerts.py's module docstring for why. Typically has
    # only 2-3 entries covering the WHOLE English network at any moment,
    # so 0 matches for your specific road on any given build is normal,
    # not a sign something's broken. Has no start/end time (see
    # sources/travel_alerts.py) -- deliberately, since the source data
    # itself has none.

    # Traffic Scotland "Current Incidents" -- live incidents/queues/
    # closures on the Scotland side, complementing the roadworks
    # scraper above. NOT auto-enabled -- add one entry per road, e.g.:
    #   - type: "scotland_incidents_scraper"
    #     road_name: "M74"
    # Fully separate module from traffic_scotland.py (no cross-imports),
    # so a change to one Scotland source can't affect the other. Real
    # M74 entries were present when this was built (queues at J5/J2a),
    # but broader testing was deliberately deferred until there's a real
    # M74 incident to check the full pipeline against -- see
    # sources/scotland_incidents.py's module docstring for the known
    # limitation this implies (possible overlap with the roadworks
    # scraper for the same physical closure, not yet resolved).

    # National Highways live traffic search (unofficial, beta) -- an
    # internal endpoint found by inspecting network requests on National
    # Highways' new (still-in-beta) "Check current incidents,
    # disruptions and delays" page, since that page shows placeholder
    # content until you actually search. NOT auto-enabled -- add one
    # entry per English road, e.g.:
    #   - type: "national_highways_traffic_search"
    #     road_name: "M6"
    # UNOFFICIAL AND UNDOCUMENTED -- unlike the versioned Road & Lane
    # Closures API v2, this could change shape or be withdrawn without
    # notice at any time. Fills a genuinely different gap though: real-
    # time traffic-flow data (congestion, abnormal traffic), distinct
    # from scheduled roadworks and from Travel Alerts' highest-severity-
    # only incidents -- see sources/national_highways_traffic_search.py's
    # module docstring for how this was found and what it covers.

    # --- Incident sources (enabled) ---------------------------------
    # Travel Alerts (major incidents: crashes, fires, serious
    # collisions). The listing page is national and fetched ONCE per
    # build regardless of how many roads are listed here (see
    # sources/travel_alerts.py's _page_cache) -- so adding roads costs
    # no extra HTTP requests.
    - type: "travel_alerts_scraper"
      road_name: "M6"
    - type: "travel_alerts_scraper"
      road_name: "M57"
    - type: "travel_alerts_scraper"
      road_name: "M58"
    - type: "travel_alerts_scraper"
      road_name: "M62"

    # Traffic Scotland live incidents (queues, breakdowns, closures).
    # Also fetched once per build, same caching as above.
    - type: "scotland_incidents_scraper"
      road_name: "M74"

    # National Highways live traffic search (unofficial beta endpoint --
    # congestion / abnormal traffic). Unlike the two above, this one IS
    # a real per-road API query, so each road here is a separate HTTP
    # request.
    - type: "national_highways_traffic_search"
      road_name: "M6"
    - type: "national_highways_traffic_search"
      road_name: "M57"
    - type: "national_highways_traffic_search"
      road_name: "M58"
    - type: "national_highways_traffic_search"
      road_name: "M62"

    # TomTom Traffic Incidents -- a genuinely separate, third-party live
    # accidents/incidents feed (see sources/tomtom_incidents.py's module
    # docstring for why this was added and its known limitations,
    # especially: no reliable direction field, so an incident with no
    # explicit direction in its own text shows on BOTH directions rather
    # than being guessed or dropped). NOT auto-enabled by default -- add
    # one entry per road you want covered, e.g.:
    #   - type: "tomtom_incidents"
    #     road_name: "M6"
    # Requires a free API key from https://developer.tomtom.com/, set as
    # a GitHub Actions secret named TOMTOM_API_KEY (see README) -- same
    # pattern as NATIONAL_HIGHWAYS_API_KEY, but a missing key here only
    # warns and skips this one source rather than failing the build,
    # since this is an additional source, not the primary one.
    # All roads sharing the default bounding box (every road already in
    # this file does) are fetched in a SINGLE shared HTTP request, so
    # adding more roads below costs nothing extra -- see
    # fetch_incidents_in_bbox()'s caching in sources/tomtom_incidents.py.
    # Optional per-entry overrides: `bbox: "minLon,minLat,maxLon,maxLat"`
    # and `category_filter: <int bitmask>` (defaults documented in
    # sources/tomtom_incidents.py).
    # - type: "tomtom_incidents"
    #   road_name: "M6"
    # - type: "tomtom_incidents"
    #   road_name: "M57"
    # - type: "tomtom_incidents"
    #   road_name: "M58"
    # - type: "tomtom_incidents"
    #   road_name: "M62"
    # - type: "tomtom_incidents"
    #   road_name: "M74"

routes:
  - id: axis
    name: "Axis"
    directions:
      southbound:
        label: "Southbound"
        legs:
          - road_name: "M74"
            junction_from: 8
            junction_to: 22
            data_direction: "Southbound"
          - road_name: "M6"
            junction_from: 45
            junction_to: 26
            data_direction: "southBound"
          - road_name: "M58"
            junction_from: null
            junction_to: null
            data_direction: "westBound"
          - road_name: "M57"
            junction_from: 6
            junction_to: 4
            data_direction: "southBound"
      northbound:
        label: "Northbound"
        legs:
          - road_name: "M57"
            junction_from: 4
            junction_to: 6
            data_direction: "northBound"
          - road_name: "M58"
            junction_from: null
            junction_to: null
            data_direction: "eastBound"
          - road_name: "M6"
            junction_from: 26
            junction_to: 45
            data_direction: "northBound"
          - road_name: "M74"
            junction_from: 22
            junction_to: 8
            data_direction: "Northbound"

  - id: omega
    name: "Omega"
    directions:
      southbound:
        label: "Southbound"
        legs:
          - road_name: "M74"
            junction_from: 8
            junction_to: 22
            data_direction: "Southbound"
          - road_name: "M6"
            junction_from: 45
            junction_to: 21
            data_direction: "southBound"
          - road_name: "M62"
            junction_from: 10
            junction_to: 8
            data_direction: "westBound"
      northbound:
        label: "Northbound"
        legs:
          - road_name: "M62"
            junction_from: 8
            junction_to: 10
            data_direction: "eastBound"
          - road_name: "M6"
            junction_from: 21
            junction_to: 45
            data_direction: "northBound"
          - road_name: "M74"
            junction_from: 22
            junction_to: 8
            data_direction: "Northbound"
